<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080" role="img" aria-labelledby="title desc">
  <title id="title">System Architecture</title>
  <desc id="desc">A system architecture diagram for LemonBeam showing the user, React frontend, Node and Express backend, GitHub API, repo scanner, temporary SQLite database, task delegation coordinator, LLM API, cleanup step, and completed guide return path.</desc>
  <defs>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth">
      <path d="M2,2 L10,6 L2,10 Z" fill="#334155"/>
    </marker>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="8" stdDeviation="8" flood-color="#0f172a" flood-opacity="0.16"/>
    </filter>
    <style>
      .bg { fill: #f8fafc; }
      .title { font: 700 44px Arial, Helvetica, sans-serif; fill: #0f172a; }
      .subtitle { font: 400 20px Arial, Helvetica, sans-serif; fill: #475569; }
      .section { font: 700 18px Arial, Helvetica, sans-serif; fill: #334155; letter-spacing: .5px; }
      .node { fill: #ffffff; stroke: #CBD5E1; stroke-width: 2; filter: url(#shadow); }
      .node-soft { fill: #EEF6FF; stroke: #93C5FD; stroke-width: 2; filter: url(#shadow); }
      .node-green { fill: #ECFDF5; stroke: #86EFAC; stroke-width: 2; filter: url(#shadow); }
      .node-purple { fill: #F5F3FF; stroke: #C4B5FD; stroke-width: 2; filter: url(#shadow); }
      .node-orange { fill: #FFF7ED; stroke: #FDBA74; stroke-width: 2; filter: url(#shadow); }
      .db { fill: #FFFBEB; stroke: #FBBF24; stroke-width: 2; filter: url(#shadow); }
      .label { font: 700 22px Arial, Helvetica, sans-serif; fill: #0f172a; }
      .small { font: 400 16px Arial, Helvetica, sans-serif; fill: #475569; }
      .edge { fill: none; stroke: #334155; stroke-width: 2.4; marker-end: url(#arrow); }
      .edge-soft { fill: none; stroke: #64748b; stroke-width: 2.1; marker-end: url(#arrow); }
      .edge-label { font: 600 15px Arial, Helvetica, sans-serif; fill: #0f172a; }
      .pill { fill: #ffffff; stroke: #CBD5E1; stroke-width: 1.4; }
      .phase-line { stroke: #CBD5E1; stroke-width: 1.5; stroke-dasharray: 5 8; }
    </style>
  </defs>
  <rect class="bg" x="0" y="0" width="1920" height="1080"/>
  <text class="title" x="90" y="86">System Architecture</text>
  <text class="subtitle" x="90" y="121">LemonBeam scans a public repo, retrieves source-backed evidence, and generates a contributor starter guide.</text>
  <line class="phase-line" x1="90" y1="160" x2="1830" y2="160"/>
  <text class="section" x="115" y="196">USER ENTRY</text>
  <text class="section" x="560" y="196">BACKEND COORDINATION</text>
  <text class="section" x="1050" y="196">RAG PIPELINE</text>
  <text class="section" x="1490" y="196">GENERATION + CLEANUP</text>
  <rect class="node" x="95" y="365" width="185" height="92" rx="12"/>
  <text class="label" x="187.5" y="402" text-anchor="middle">User</text>
  <text class="small" x="187.5" y="431" text-anchor="middle">submits repo URL</text>
  <rect class="node-soft" x="380" y="345" width="270" height="132" rx="12"/>
  <text class="label" x="515" y="388" text-anchor="middle">React + Vite</text>
  <text class="label" x="515" y="416" text-anchor="middle">Frontend</text>
  <text class="small" x="515" y="448" text-anchor="middle">displays the guide</text>
  <path class="edge" d="M280 398 C314 398, 338 398, 376 398"/>
  <rect class="pill" x="288" y="360" width="154" height="30" rx="7"/>
  <text class="edge-label" x="365" y="381" text-anchor="middle">GitHub URL</text>
  <path class="edge-soft" d="M380 442 C335 442, 322 442, 284 442"/>
  <rect class="pill" x="286" y="459" width="160" height="30" rx="7"/>
  <text class="edge-label" x="366" y="480" text-anchor="middle">completed guide</text>
  <rect class="node-green" x="760" y="340" width="285" height="142" rx="12"/>
  <text class="label" x="902.5" y="386" text-anchor="middle">Node.js + Express</text>
  <text class="label" x="902.5" y="414" text-anchor="middle">Backend</text>
  <text class="small" x="902.5" y="448" text-anchor="middle">coordinates scan requests</text>
  <path class="edge" d="M650 403 C690 403, 716 403, 756 403"/>
  <rect class="pill" x="657" y="365" width="156" height="30" rx="7"/>
  <text class="edge-label" x="735" y="386" text-anchor="middle">scan request</text>
  <path class="edge-soft" d="M760 455 C719 455, 692 455, 654 455"/>
  <rect class="pill" x="660" y="474" width="190" height="30" rx="7"/>
  <text class="edge-label" x="755" y="495" text-anchor="middle">Markdown + HTML</text>
  <rect class="node" x="1165" y="210" width="245" height="100" rx="12"/>
  <text class="label" x="1287.5" y="253" text-anchor="middle">GitHub API</text>
  <text class="small" x="1287.5" y="282" text-anchor="middle">repo snapshot access</text>
  <path class="edge" d="M990 340 C1048 286, 1087 260, 1161 260"/>
  <rect class="pill" x="995" y="235" width="226" height="44" rx="7"/>
  <text class="edge-label" x="1108" y="253" text-anchor="middle">validate repo + request</text>
  <text class="edge-label" x="1108" y="272" text-anchor="middle">exact commit snapshot</text>
  <path class="edge-soft" d="M1165 292 C1105 326, 1064 350, 1048 371"/>
  <rect class="pill" x="1048" y="307" width="224" height="50" rx="7"/>
  <text class="edge-label" x="1160" y="327" text-anchor="middle">metadata, commit SHA,</text>
  <text class="edge-label" x="1160" y="347" text-anchor="middle">source files</text>
  <rect class="node-purple" x="1165" y="410" width="300" height="132" rx="12"/>
  <text class="label" x="1315" y="453" text-anchor="middle">Repo Scanner +</text>
  <text class="label" x="1315" y="481" text-anchor="middle">Chunker + Classifier</text>
  <text class="small" x="1315" y="514" text-anchor="middle">heuristic/regex-based</text>
  <path class="edge" d="M1045 433 C1080 448, 1117 461, 1161 469"/>
  <rect class="pill" x="1057" y="442" width="148" height="30" rx="7"/>
  <text class="edge-label" x="1131" y="463" text-anchor="middle">source files</text>
  <path class="db" d="M1512 600 C1512 574, 1592 555, 1700 555 C1808 555, 1888 574, 1888 600 L1888 724 C1888 750, 1808 768, 1700 768 C1592 768, 1512 750, 1512 724 Z"/>
  <ellipse class="db" cx="1700" cy="600" rx="188" ry="45"/>
  <text class="label" x="1700" y="641" text-anchor="middle">Temporary SQLite</text>
  <text class="label" x="1700" y="669" text-anchor="middle">Database</text>
  <text class="small" x="1700" y="704" text-anchor="middle">file/chunk metadata,</text>
  <text class="small" x="1700" y="727" text-anchor="middle">classifications, citations</text>
  <path class="edge" d="M1465 518 C1538 548, 1564 563, 1595 584"/>
  <rect class="pill" x="1465" y="512" width="238" height="45" rx="7"/>
  <text class="edge-label" x="1584" y="531" text-anchor="middle">stores metadata, chunks,</text>
  <text class="edge-label" x="1584" y="550" text-anchor="middle">classifications, citations</text>
  <rect class="node-orange" x="1045" y="670" width="335" height="132" rx="12"/>
  <text class="label" x="1212.5" y="714" text-anchor="middle">Task Delegation</text>
  <text class="label" x="1212.5" y="742" text-anchor="middle">Coordinator</text>
  <text class="small" x="1212.5" y="775" text-anchor="middle">section-level retrieval + prompts</text>
  <path class="edge" d="M940 482 C986 562, 1034 630, 1080 668"/>
  <rect class="pill" x="878" y="565" width="236" height="30" rx="7"/>
  <text class="edge-label" x="996" y="586" text-anchor="middle">starts guide orchestration</text>
  <path class="edge" d="M1380 720 C1425 691, 1463 674, 1510 660"/>
  <rect class="pill" x="1375" y="675" width="226" height="45" rx="7"/>
  <text class="edge-label" x="1488" y="694" text-anchor="middle">requests evidence for</text>
  <text class="edge-label" x="1488" y="713" text-anchor="middle">each guide section</text>
  <path class="edge-soft" d="M1512 714 C1465 746, 1426 761, 1383 766"/>
  <rect class="pill" x="1376" y="775" width="246" height="45" rx="7"/>
  <text class="edge-label" x="1499" y="794" text-anchor="middle">returns source-backed chunks</text>
  <text class="edge-label" x="1499" y="813" text-anchor="middle">and citation references</text>
  <rect class="node" x="1165" y="875" width="300" height="110" rx="12"/>
  <text class="label" x="1315" y="919" text-anchor="middle">OpenAI or</text>
  <text class="label" x="1315" y="947" text-anchor="middle">Anthropic API</text>
  <text class="small" x="1315" y="974" text-anchor="middle">generates guide sections</text>
  <path class="edge" d="M1238 802 C1255 829, 1271 850, 1284 872"/>
  <rect class="pill" x="1038" y="835" width="250" height="45" rx="7"/>
  <text class="edge-label" x="1163" y="854" text-anchor="middle">bounded prompts with</text>
  <text class="edge-label" x="1163" y="873" text-anchor="middle">selected evidence</text>
  <path class="edge-soft" d="M1195 875 C1162 849, 1145 827, 1135 805"/>
  <rect class="pill" x="875" y="835" width="226" height="45" rx="7"/>
  <text class="edge-label" x="988" y="854" text-anchor="middle">guide sections</text>
  <text class="edge-label" x="988" y="873" text-anchor="middle">with citations</text>
  <rect class="node" x="735" y="760" width="250" height="100" rx="12"/>
  <text class="label" x="860" y="803" text-anchor="middle">Cleanup Step</text>
  <text class="small" x="860" y="833" text-anchor="middle">delete temp repo + DB</text>
  <path class="edge-soft" d="M1045 762 C1018 777, 1002 787, 989 795"/>
  <rect class="pill" x="914" y="721" width="206" height="30" rx="7"/>
  <text class="edge-label" x="1017" y="742" text-anchor="middle">completed guide assembled</text>
  <path class="edge-soft" d="M812 760 C777 675, 812 563, 860 486"/>
  <rect class="pill" x="745" y="651" width="184" height="30" rx="7"/>
  <text class="edge-label" x="837" y="672" text-anchor="middle">cleanup after return</text>
  <path class="edge-soft" d="M1045 706 C993 627, 952 545, 924 486"/>
  <rect class="pill" x="961" y="620" width="212" height="45" rx="7"/>
  <text class="edge-label" x="1067" y="639" text-anchor="middle">assembled Markdown</text>
  <text class="edge-label" x="1067" y="658" text-anchor="middle">+ HTML guide</text>
</svg>
